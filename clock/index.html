<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0B0610;
}

body {
  font-family: Inter, -apple-system, BlinkMacSystemFont,
               "Segoe UI", Arial, sans-serif;
}

.widget {
  position: fixed;
  inset: 0;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  overflow: hidden;

  background:
    radial-gradient(
      ellipse at 50% 0%,
      rgba(139, 60, 220, 0.20),
      transparent 65%
    ),
    #0B0610;

  /* PAS DE CONTOUR */
  border: none;

  /* PAS DE COINS ARRONDIS */
  border-radius: 0;
}

.time {
  color: #F8F5FF;
  font-size: clamp(30px, 10vh, 48px);
  font-weight: 700;
  line-height: 1;
  letter-spacing: -2px;
}

.date {
  margin-top: 10px;

  color: #B85CFF;
  font-size: clamp(9px, 2.5vh, 12px);
  font-weight: 600;

  letter-spacing: 2px;
  text-transform: uppercase;
  white-space: nowrap;
}
</style>
</head>

<body>

<div class="widget">
  <div class="time" id="time">--:--</div>
  <div class="date" id="date"></div>
</div>

<script>
function updateClock() {
  const now = new Date();

  document.getElementById("time").textContent =
    now.toLocaleTimeString("fr-FR", {
      hour: "2-digit",
      minute: "2-digit"
    });

  document.getElementById("date").textContent =
    now.toLocaleDateString("fr-FR", {
      weekday: "long",
      day: "2-digit",
      month: "long"
    });
}

updateClock();
setInterval(updateClock, 10000);
</script>

</body>
</html>
