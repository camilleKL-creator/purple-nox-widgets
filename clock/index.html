<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Purple Nox Clock</title>

<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }

  body {
    font-family: Inter, -apple-system, BlinkMacSystemFont,
                 "Segoe UI", Roboto, Arial, sans-serif;
  }

  .clock {
    width: 100vw;
    height: 100vh;
    min-height: 110px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    background:
      radial-gradient(
        circle at 50% 0%,
        rgba(150, 70, 255, 0.22) 0%,
        rgba(80, 30, 130, 0.10) 40%,
        transparent 70%
      ),
      linear-gradient(
        135deg,
        #160B24 0%,
        #0D0715 55%,
        #08050D 100%
      );

    border: 1px solid rgba(168, 85, 247, 0.25);
    border-radius: 18px;

    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.04),
      inset 0 0 35px rgba(139,92,246,0.05);
  }

  .time {
    color: #F5F0FF;

    font-size: clamp(42px, 10vw, 72px);
    font-weight: 700;
    line-height: 0.95;
    letter-spacing: -3px;

    text-shadow:
      0 0 25px rgba(168,85,247,0.18);
  }

  .date {
    margin-top: 12px;

    color: #B05CFF;

    font-size: clamp(10px, 2.2vw, 14px);
    font-weight: 600;
    letter-spacing: 2.4px;
    text-transform: uppercase;
  }
</style>
</head>

<body>

<div class="clock">
  <div class="time" id="time">--:--</div>
  <div class="date" id="date"></div>
</div>

<script>
  function updateClock() {
    const now = new Date();

    const time = new Intl.DateTimeFormat("fr-FR", {
      hour: "2-digit",
      minute: "2-digit",
      hour12: false
    }).format(now);

    const date = new Intl.DateTimeFormat("fr-FR", {
      weekday: "long",
      day: "2-digit",
      month: "long"
    }).format(now);

    document.getElementById("time").textContent = time;
    document.getElementById("date").textContent = date;
  }

  updateClock();

  // Vérification toutes les 10 secondes,
  // mais l'affichage reste uniquement HH:MM.
  setInterval(updateClock, 10000);
</script>

</body>
</html>
