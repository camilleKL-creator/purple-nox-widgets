<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Purple Nox Clock</title>

<style>
  * {
    box-sizing: border-box;
  }

  html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent !important;
  }

  body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;

    overflow: hidden;
    background: transparent !important;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    font-family:
      ui-sans-serif,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      Helvetica,
      Arial,
      sans-serif;
  }

  #time {
    margin: 0;

    /* 🍇 VIOLET NOX */
    color: #3E1849;

    font-size: clamp(32px, 8vh, 46px);
    font-weight: 700;
    line-height: 1;
    letter-spacing: -2px;

    white-space: nowrap;
  }

  #date {
    margin-top: 10px;

    /* 🍓 FRAMBOISE */
    color: #B63B68;

    font-size: clamp(9px, 2.2vh, 11px);
    font-weight: 700;
    line-height: 1;
    letter-spacing: 2px;

    text-transform: uppercase;
    white-space: nowrap;
  }
</style>
</head>

<body>

<div id="time">--:--</div>
<div id="date"></div>

<script>
  const time = document.getElementById("time");
  const date = document.getElementById("date");

  function updateClock() {
    const now = new Date();

    time.textContent = new Intl.DateTimeFormat("fr-FR", {
      hour: "2-digit",
      minute: "2-digit",
      hour12: false
    }).format(now);

    date.textContent = new Intl.DateTimeFormat("fr-FR", {
      weekday: "long",
      day: "2-digit",
      month: "long"
    }).format(now);
  }

  updateClock();
  setInterval(updateClock, 1000);
</script>

</body>
</html>
