<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Purple Nox Clock</title>

<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;

    overflow: hidden;

    /* Même couleur que le fond sombre Notion */
    background: #191919;
  }

  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    font-family:
      ui-sans-serif,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      Helvetica,
      Arial,
      sans-serif;

    user-select: none;
  }

  /* 🍇 HEURE — VIOLET NOX */
  #time {
    margin: 0;

    color: #3E1849;

    font-size: clamp(44px, 11vh, 58px);
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: -2px;

    white-space: nowrap;
  }

  /* 🍓 DATE — FRAMBOISE */
  #date {
    margin-top: 12px;

    color: #B63B68;

    font-size: clamp(12px, 3vh, 15px);
    font-weight: 700;
    line-height: 1;

    letter-spacing: 2.5px;
    text-transform: uppercase;
    white-space: nowrap;
  }
</style>
</head>

<body>

<div id="time">--:--</div>
<div id="date"></div>

<script>
  const time = document.getElementById("time");
  const date = document.getElementById("date");

  function updateClock() {
    const now = new Date();

    time.textContent = new Intl.DateTimeFormat("fr-FR", {
      hour: "2-digit",
      minute: "2-digit",
      hour12: false
    }).format(now);

    date.textContent = new Intl.DateTimeFormat("fr-FR", {
      weekday: "long",
      day: "2-digit",
      month: "long"
    }).format(now);
  }

  updateClock();
  setInterval(updateClock, 1000);
</script>

</body>
</html>
