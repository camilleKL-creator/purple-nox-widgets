<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Purple Nox Clock</title>

<style>
  *, *::before, *::after {
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #0b0610;
  }

  body {
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;

    /* Arrière-plan Purple Nox */
    background:
      radial-gradient(
        ellipse at 50% 0%,
        rgba(139, 60, 220, 0.22) 0%,
        rgba(75, 25, 120, 0.08) 48%,
        transparent 72%
      ),
      #0b0610;
  }

  #time {
    margin: 0;
    color: #f8f5ff;
    font-size: clamp(32px, 8vh, 46px);
    font-weight: 700;
    line-height: 1;
    letter-spacing: -2px;
  }

  #date {
    margin-top: 10px;
    color: #b85cff;
    font-size: clamp(9px, 2.2vh, 11px);
    font-weight: 700;
    line-height: 1;
    letter-spacing: 2px;
    text-transform: uppercase;
    white-space: nowrap;
  }
</style>
</head>

<body>

  <div id="time">--:--</div>
  <div id="date"></div>

<script>
  const timeElement = document.getElementById("time");
  const dateElement = document.getElementById("date");

  function updateClock() {
    const now = new Date();

    timeElement.textContent = new Intl.DateTimeFormat("fr-FR", {
      hour: "2-digit",
      minute: "2-digit",
      hour12: false
    }).format(now);

    dateElement.textContent = new Intl.DateTimeFormat("fr-FR", {
      weekday: "long",
      day: "2-digit",
      month: "long"
    }).format(now);
  }

  updateClock();
  setInterval(updateClock, 1000);
</script>

</body>
</html>
