<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Purple Nox Clock</title>

<style>

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;

  /* IVOIRE */
  background: #F4EFE6;
}

body {
  font-family:
    ui-sans-serif,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Helvetica,
    Arial,
    sans-serif;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  border: none;
  border-radius: 0;
  outline: none;

  user-select: none;
}

/* HEURE — VIOLET NOX */

#time {
  margin: 0;

  color: #3E1849;

  font-size: clamp(32px, 8vh, 46px);
  font-weight: 700;
  line-height: 1;
  letter-spacing: -2px;

  white-space: nowrap;
}

/* DATE — FRAMBOISE */

#date {
  margin-top: 10px;

  color: #B63B68;

  font-size: clamp(9px, 2.2vh, 11px);
  font-weight: 700;
  line-height: 1;
  letter-spacing: 2px;

  text-transform: uppercase;
  white-space: nowrap;
}

</style>
</head>

<body>

<div id="time">--:--</div>
<div id="date"></div>

<script>

const timeElement = document.getElementById("time");
const dateElement = document.getElementById("date");

function updateClock() {

  const now = new Date();

  timeElement.textContent =
    new Intl.DateTimeFormat("fr-FR", {
      hour: "2-digit",
      minute: "2-digit",
      hour12: false
    }).format(now);

  dateElement.textContent =
    new Intl.DateTimeFormat("fr-FR", {
      weekday: "long",
      day: "2-digit",
      month: "long"
    }).format(now);
}

updateClock();

/* Actualisation toutes les 10 secondes */
setInterval(updateClock, 10000);

</script>

</body>
</html>
