
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Purple Nox Widgets</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    background: #08050D;
    color: white;
    font-family: Arial, sans-serif;

    display: flex;
    align-items: center;
    justify-content: center;
}

main {
    text-align: center;
}

h1 {
    color: #B05CFF;
    font-size: 42px;
    margin-bottom: 8px;
}

p {
    color: #aaa0b8;
    margin-bottom: 35px;
}

.widget {
    display: block;
    width: 260px;
    padding: 18px;

    background: #160B24;
    border: 1px solid #6D28D9;
    border-radius: 15px;

    color: white;
    text-decoration: none;
    font-size: 18px;

    transition: 0.2s;
}

.widget:hover {
    background: #25103D;
    border-color: #B05CFF;
}
</style>
</head>

<body>

<main>

    <h1>PURPLE NOX</h1>
    <p>Mes widgets Notion</p>

    <a class="widget" href="./clock/">
        🕐 Horloge
    </a>

</main>

</body>
</html>
