<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Purple Nox Clock</title>

<style>

  /* RESET */
  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    overflow: hidden;

    /* FOND 100% TRANSPARENT */
    background: transparent !important;
  }

  body {

    /* TYPO PROCHE DU DEFAULT NOTION */
    font-family:
      ui-sans-serif,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      Helvetica,
      Arial,
      sans-serif;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    border: none;
    outline: none;

    user-select: none;
  }


  /* HEURE */

  #time {

    margin: 0;

    color: #B85CFF;

    font-size: clamp(32px, 8vh, 46px);

    font-weight: 700;

    line-height: 1;

    letter-spacing: -2px;

    white-space: nowrap;
  }


  /* DATE */

  #date {

    margin-top: 10px;

    color: #FFFFF0;

    font-size: clamp(9px, 2.2vh, 11px);

    font-weight: 700;

    line-height: 1;

    letter-spacing: 2px;

    text-transform: uppercase;

    white-space: nowrap;
  }

</style>
</head>


<body>

  <div id="time">--:--</div>

  <div id="date"></div>


<script>

  const timeElement = document.getElementById("time");
  const dateElement = document.getElementById("date");


  function updateClock() {

    const now = new Date();


    /* HEURE : HH:MM */

    timeElement.textContent =
      new Intl.DateTimeFormat("fr-FR", {

        hour: "2-digit",
        minute: "2-digit",
        hour12: false

      }).format(now);


    /* DATE */

    dateElement.textContent =
      new Intl.DateTimeFormat("fr-FR", {

        weekday: "long",
        day: "2-digit",
        month: "long"

      }).format(now);

  }


  updateClock();


  /* Mise à jour régulière */

  setInterval(updateClock, 1000);

</script>

</body>

</html>
