<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Purple Nox Widgets</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100vh;

  background: #181219;
  color: #F4EFE6;

  font-family:
    ui-sans-serif,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Helvetica,
    Arial,
    sans-serif;

  display: flex;
  justify-content: center;

  padding: 80px 24px;
}

.container {
  width: 100%;
  max-width: 520px;
  text-align: center;
}

h1 {
  margin: 0;

  color: #F4EFE6;

  font-size: 42px;
  font-weight: 700;
  letter-spacing: -1px;
}

.subtitle {
  margin: 10px 0 45px;

  color: #B63B68;

  font-size: 14px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.widget-link {
  display: block;

  width: 100%;
  padding: 22px;

  color: #F4EFE6;
  background: #3E1849;

  text-decoration: none;

  font-size: 18px;
  font-weight: 600;

  border: none;
  border-radius: 10px;

  transition: background 0.2s ease;
}

.widget-link:hover {
  background: #B63B68;
}
</style>
</head>

<body>

<main class="container">

  <h1>PURPLE NOX</h1>

  <div class="subtitle">
    WIDGETS NOTION
  </div>

  <a class="widget-link" href="./clock/">
    Horloge
  </a>

</main>

</body>
</html>
